<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northfield University — Student Portal</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f1f5f9; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { background: #1e3a8a; color: #fff; padding: 14px 28px; display: flex; align-items: center; gap: 12px; }
    .crest { width: 36px; height: 36px; border-radius: 50%; background: #fbbf24; color: #1e3a8a; font-weight: 800; display: grid; place-items: center; }
    .topbar h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
    main { flex: 1; display: grid; place-items: center; padding: 24px; }
    .panel { width: 100%; max-width: 400px; background: #fff; border-radius: 10px; box-shadow: 0 4px 18px rgba(15,23,42,.1); padding: 28px; }
    .panel h2 { margin: 0 0 4px; font-size: 1.3rem; }
    .sub { margin: 0 0 18px; color: #64748b; font-size: .88rem; }
    label { display: block; font-size: .82rem; font-weight: 600; margin: 12px 0 5px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: .95rem; }
    input:focus { outline: 2px solid #3b82f6; border-color: #3b82f6; }
    button { cursor: pointer; border: 0; border-radius: 6px; padding: 11px; font-weight: 600; font-size: .95rem; }
    .primary { width: 100%; margin-top: 18px; background: #1e3a8a; color: #fff; }
    .primary:disabled { opacity: .6; cursor: not-allowed; }
    .msg { margin-top: 14px; padding: 10px 12px; border-radius: 6px; font-size: .88rem; display: none; }
    .msg.err { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .msg.warn { display: block; background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .msg.ok { display: block; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .msg.lock { display: block; background: #7f1d1d; color: #fff; border: 1px solid #450a0a; font-weight: 600; }
    .corr { display: block; margin-top: 4px; font-size: .75rem; opacity: .75; font-family: ui-monospace, monospace; }
    .dash { display: none; }
    .dash pre { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; font-size: .8rem; overflow-x: auto; }
    .ghost { background: #e2e8f0; color: #1e293b; margin-top: 10px; width: 100%; }
    .admin { max-width: 400px; width: 100%; margin-top: 18px; background: #fff; border: 1px dashed #94a3b8; border-radius: 10px; padding: 14px 18px; font-size: .85rem; }
    .admin summary { cursor: pointer; font-weight: 600; color: #475569; }
    .admin .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .danger { width: 100%; margin-top: 12px; background: #b45309; color: #fff; }
    footer { text-align: center; font-size: .75rem; color: #94a3b8; padding: 14px; }
  </style>
</head>
<body>
  <div class="topbar"><div class="crest">N</div><h1>Northfield University · Student Portal</h1></div>

  <main>
    <div style="width:100%;max-width:400px">
      <!-- LOGIN -->
      <section class="panel" id="loginView">
        <h2>Sign in</h2>
        <p class="sub">Use your university username and password.</p>
        <form id="loginForm" autocomplete="off">
          <label for="username">Username</label>
          <input id="username" name="username" required maxlength="64" />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required maxlength="128" />
          <button class="primary" id="loginBtn" type="submit">Sign in</button>
        </form>
        <div class="msg" id="loginMsg"></div>
      </section>

      <!-- AUTHENTICATED VIEW -->
      <section class="panel dash" id="dashView">
        <h2>Welcome back</h2>
        <p class="sub" id="welcome"></p>
        <button class="primary" id="profileBtn" type="button">Load my profile</button>
        <pre id="profileOut">—</pre>
        <button class="ghost" id="logoutBtn" type="button">Sign out</button>
      </section>

      <!-- ADMIN -->
      <details class="admin">
        <summary>Security desk (admin recovery)</summary>
        <div class="row">
          <div><label for="adminUser">Username</label><input id="adminUser" value="synthetic_student_01" /></div>
          <div><label for="adminKey">Admin key</label><input id="adminKey" type="password" /></div>
        </div>
        <button class="danger" id="unqBtn" type="button">Unquarantine user</button>
        <div class="msg" id="adminMsg"></div>
      </details>
    </div>
  </main>

  <footer>Academic project — synthetic accounts only. © Northfield University (fictional)</footer>

  <script>
    // Served from FastAPI at http://localhost:8000/ -> same origin. If opened as file://, fall back.
    const API = location.protocol === "file:" ? "http://localhost:8000" : "";
    let session = null; // {user, token}

    const $ = (id) => document.getElementById(id);

    function show(el, cls, text, corr) {
      el.className = "msg " + cls;
      el.textContent = text;
      if (corr) {
        const s = document.createElement("span");
        s.className = "corr";
        s.textContent = "Reference: " + corr;
        el.appendChild(s);
      }
    }

    // The ONLY data the client sends for login: username + password.
    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = $("username").value.trim();
      const password = $("password").value;
      $("loginBtn").disabled = true;
      try {
        const res = await fetch(`${API}/events/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        $("password").value = "";

        if (res.ok) {
          session = { user: data.user_id, token: data.session_token };
          $("loginView").style.display = "none";
          $("dashView").style.display = "block";
          $("welcome").textContent = `Signed in as ${data.user_id}`;
          $("profileOut").textContent = "—";
        } else if (res.status === 403) {
          show($("loginMsg"), "lock", data.detail || "Account quarantined.", data.correlation_id);
        } else if (res.status === 401) {
          // Same message for wrong password and unknown user: no hints about which usernames exist.
          show($("loginMsg"), "err", data.detail || "Invalid username or password", data.correlation_id);
        } else {
          show($("loginMsg"), "err", data.detail || "Unexpected error", data.correlation_id);
        }
      } catch (err) {
        show($("loginMsg"), "err", "Cannot reach the server. Is the API running on port 8000?");
      } finally {
        $("loginBtn").disabled = false;
      }
    });

    $("profileBtn").addEventListener("click", async () => {
      if (!session) return;
      const res = await fetch(`${API}/users/${encodeURIComponent(session.user)}/profile`, {
        headers: { Authorization: `Bearer ${session.token}` },
      });
      const data = await res.json().catch(() => ({}));
      $("profileOut").textContent = `HTTP ${res.status}\n` + JSON.stringify(data, null, 2);
    });

    $("logoutBtn").addEventListener("click", () => {
      session = null;
      $("dashView").style.display = "none";
      $("loginView").style.display = "block";
      $("loginMsg").className = "msg";
    });

    // Admin recovery so reviewers can reset the demo.
    $("unqBtn").addEventListener("click", async () => {
      const user = $("adminUser").value.trim();
      try {
        const res = await fetch(`${API}/users/${encodeURIComponent(user)}/unquarantine`, {
          method: "POST",
          headers: { "X-Admin-Key": $("adminKey").value },
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) show($("adminMsg"), "ok", `${data.user_id} restored to ${data.account_status}.`, data.correlation_id);
        else show($("adminMsg"), "err", data.detail || "Failed", data.correlation_id);
      } catch (err) {
        show($("adminMsg"), "err", "Cannot reach the server.");
      }
    });
  </script>
</body>
</html>
